
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل تطبيق أذاني</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg, #102d22, #071810);
      font-family: Tahoma, Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px 24px;
      border-radius: 24px;
      background: #183c2d;
      border: 1px solid #426b51;
      box-shadow: 0 15px 40px #0005;
    }

    .logo {
      font-size: 65px;
      margin-bottom: 12px;
    }

    h1 {
      color: #f3d77b;
      font-size: 34px;
      margin: 10px 0;
    }

    .description {
      color: #e0eadf;
      line-height: 1.9;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .download {
      display: block;
      width: 100%;
      padding: 17px;
      border-radius: 13px;
      background: #e7c96d;
      color: #173322;
      font-size: 19px;
      font-weight: bold;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .download:active {
      transform: scale(.98);
    }

    .counter {
      margin-top: 25px;
      padding: 17px;
      border-radius: 14px;
      background: #102d22;
      border: 1px solid #426b51;
    }

    .counter-title {
      color: #d9e8d9;
      font-size: 15px;
    }

    #downloadCount {
      display: block;
      color: #f3d77b;
      font-size: 32px;
      font-weight: bold;
      margin-top: 8px;
    }

    .footer {
      margin-top: 25px;
      color: #b9cdbd;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">🕌</div>

    <h1>تطبيق أذاني</h1>

    <p class="description">
      رفيقك للصلاة والذكر والقرآن الكريم.
      <br>
      حمّل التطبيق واستمتع بمميزاته على هاتفك.
    </p>

    <button class="download" id="downloadBtn">
      ⬇ تحميل تطبيق أذاني
    </button>

    <div class="counter">
      <div class="counter-title">
        إجمالي مرات الضغط على التحميل
      </div>
      <span id="downloadCount">...</span>
    </div>

    <div class="footer">
      تطبيق أذاني © جميع الحقوق محفوظة
    </div>

  </main>

  <script>
    const counterUrl =
      "https://countapi.mileshilliard.com/api/v1/";

    const counterKey =
      "azani_download_clicks_ragab121212_20261124";

    const downloadUrl =
      "https://www.dropbox.com/scl/fi/joy26oa09kgwmilo5fm0u/app-debug.apk?rlkey=wsnihkvxz8i1ykt1y3z5798uw&st=vbexwxqk&dl=1";

    const countDisplay =
      document.getElementById("downloadCount");

    const downloadButton =
      document.getElementById("downloadBtn");

    // عرض العدد الحالي دون زيادته
    async function loadCount() {
      try {
        const response = await fetch(
          counterUrl + "get/" + counterKey
        );

        const data = await response.json();

        if (data.value !== undefined) {
          countDisplay.textContent =
            Number(data.value).toLocaleString("en-US");
        } else {
          countDisplay.textContent = "0";
        }
      } catch (error) {
        countDisplay.textContent = "—";
      }
    }

    // زيادة العداد عند الضغط على زر التحميل
    downloadButton.addEventListener("click", async function () {

      downloadButton.disabled = true;
      downloadButton.textContent = "جارٍ تجهيز التحميل...";

      try {
        const response = await fetch(
          counterUrl + "hit/" + counterKey
        );

        const data = await response.json();

        if (data.value !== undefined) {
          countDisplay.textContent =
            Number(data.value).toLocaleString("en-US");
        }

      } catch (error) {
        // لا نمنع التحميل إذا تعطل العداد
      }

      // فتح رابط تنزيل التطبيق
      window.location.href = downloadUrl;
    });

    loadCount();
  </script>

</body>
</html>
